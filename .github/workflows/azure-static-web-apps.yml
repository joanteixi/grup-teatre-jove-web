name: Desplega la web a Azure Static Web Apps

# PLACEHOLDER: aquest flux de treball funciona quan tingueu el repositori a
# GitHub i l'aplicació creada a Azure Static Web Apps. El secret
# AZURE_STATIC_WEB_APPS_API_TOKEN el genera Azure i es desa a GitHub
# (Settings → Secrets and variables → Actions).
#
# Si preferiu desplegar a mà, no cal aquest fitxer: feu `npm run build` i pugueu
# la carpeta dist/ al servei que hàgiu triat.

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_i_desplega:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Compila i publica
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Prepara Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instal·la dependències
        run: npm ci

      - name: Compila la web
        run: npm run build

      - name: Publica a Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"
          output_location: "dist"

  tanca_previsualitzacio:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Tanca l'entorn de prova
    steps:
      - name: Tanca la previsualització
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: close
