  const ITER = 310000;

  const b64a = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const msg = document.getElementById('msg');
  const boto = document.getElementById('boto');
  const camp = document.getElementById('pw');

  async function obre() {
    const pw = camp.value;
    if (!pw) return;
    boto.disabled = true;
    boto.textContent = 'Desxifrant…';
    msg.textContent = '';
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
      const clau = await crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64a(SALT), iterations: ITER, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const clar = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64a(IV) }, clau, b64a(DADES));
      const html = new TextDecoder().decode(clar);
      const marc = document.createElement('iframe');
      marc.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;background:#101126';
      marc.setAttribute('title', 'Assemblea 2026');
      marc.srcdoc = html;
      document.body.innerHTML = '';
      document.body.style.padding = '0';
      document.body.style.display = 'block';
      document.body.appendChild(marc);
    } catch (e) {
      msg.textContent = 'Contrasenya incorrecta. Torna-ho a provar.';
      camp.select();
    } finally {
      boto.disabled = false;
      boto.textContent = 'Obrir la presentació';
    }
  }

  boto.addEventListener('click', obre);
  camp.addEventListener('keydown', e => { if (e.key === 'Enter') obre(); });
